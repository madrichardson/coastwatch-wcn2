
# ==========================================================
# COASTWATCH WEST COAST NODE — PAGES CMS CONFIGURATION
# ==========================================================

# ----------------------------------------------------------
# Media management
# ----------------------------------------------------------

media:
  input: images
  output: /images


# ----------------------------------------------------------
# Editable website content
# ----------------------------------------------------------

content:

  # ========================================================
  # NEWS & EVENTS
  # ========================================================

  - name: news
    label: News & Events
    type: file
    path: content/news.yml

    fields:
      - name: news
        label: News Announcements
        type: object
        list: true

        fields:
          - name: title
            label: Announcement Title
            type: string
            required: true

          - name: description
            label: Description
            type: text
            required: true

          - name: date
            label: Publication Date
            type: date
            required: true

          - name: expiration
            label: Expiration Date
            type: date


  # ========================================================
  # HOMEPAGE
  # ========================================================

  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.yml

    fields:

      # ----------------------------------------------------
      # Hero section
      # ----------------------------------------------------

      - name: hero
        label: Hero Section
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Hero Title
            type: string
            required: true

          - name: description
            label: Hero Description
            type: text

          - name: background_image
            label: Background Image
            type: image

          - name: buttons
            label: Hero Buttons
            type: object
            list: true

            fields:
              - name: label
                label: Button Label
                type: string
                required: true

              - name: url
                label: Button URL
                type: string
                required: true

              - name: style
                label: Button Style
                type: select
                options:
                  values:
                    - value: primary
                      label: Primary
                    - value: secondary
                      label: Secondary


      # ----------------------------------------------------
      # News & Events section settings
      # ----------------------------------------------------

      - name: news_section
        label: News Section Settings
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Section Title
            type: string

          - name: archive_label
            label: Archive Link Label
            type: string

          - name: archive_url
            label: Archive URL
            type: string

          - name: max_items
            label: Number of News Items
            type: number


      # ----------------------------------------------------
      # Resources section
      # ----------------------------------------------------

      - name: resources_section
        label: Resources Section
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Section Title
            type: string

          - name: cards
            label: Resource Cards
            type: object
            list: true

            fields:
              - name: title
                label: Card Title
                type: string
                required: true

              - name: description
                label: Description
                type: text

              - name: buttons
                label: Card Buttons
                type: object
                list: true

                fields:
                  - name: label
                    label: Button Label
                    type: string
                    required: true

                  - name: url
                    label: Button URL
                    type: string
                    required: true

                  - name: style
                    label: Button Style
                    type: select
                    options:
                      values:
                        - value: primary
                          label: Primary
                        - value: secondary
                          label: Secondary

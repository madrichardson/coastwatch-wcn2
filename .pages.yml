
# ==========================================================
# COASTWATCH WEST COAST NODE — PAGES CMS CONFIGURATION
# ==========================================================

# ----------------------------------------------------------
# Media management
# ----------------------------------------------------------

media:
  input: images
  output: /images


# ----------------------------------------------------------
# Editable website content
# ----------------------------------------------------------

content:

  # ========================================================
  # NEWS & EVENTS
  # ========================================================

  - name: news
    label: News & Events
    type: file
    path: content/news.yml

    fields:
      - name: news
        label: News Announcements
        type: object
        list: true

        fields:
          - name: title
            label: Announcement Title
            type: string
            required: true

          - name: description
            label: Description
            type: text
            required: true

          - name: date
            label: Publication Date
            type: date
            required: true

          - name: expiration
            label: Expiration Date
            type: date


  # ========================================================
  # HOMEPAGE
  # ========================================================

  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.yml

    fields:

      # ----------------------------------------------------
      # Hero section
      # ----------------------------------------------------

      - name: hero
        label: Hero Section
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Hero Title
            type: string
            required: true

          - name: description
            label: Hero Description
            type: text

          - name: background_image
            label: Background Image
            type: image

          - name: buttons
            label: Hero Buttons
            type: object
            list: true

            fields:
              - name: label
                label: Button Label
                type: string
                required: true

              - name: url
                label: Button URL
                type: string
                required: true

              - name: style
                label: Button Style
                type: select
                options:
                  values:
                    - value: primary
                      label: Primary
                    - value: secondary
                      label: Secondary


      # ----------------------------------------------------
      # News & Events section settings
      # ----------------------------------------------------

      - name: news_section
        label: News Section Settings
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Section Title
            type: string

          - name: archive_label
            label: Archive Link Label
            type: string

          - name: archive_url
            label: Archive URL
            type: string

          - name: max_items
            label: Number of News Items
            type: number


      # ----------------------------------------------------
      # Resources section
      # ----------------------------------------------------

      - name: resources_section
        label: Resources Section
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Section Title
            type: string

          - name: cards
            label: Resource Cards
            type: object
            list: true

            fields:
              - name: title
                label: Card Title
                type: string
                required: true

              - name: description
                label: Description
                type: text

              - name: buttons
                label: Card Buttons
                type: object
                list: true

                fields:
                  - name: label
                    label: Button Label
                    type: string
                    required: true

                  - name: url
                    label: Button URL
                    type: string
                    required: true

                  - name: style
                    label: Button Style
                    type: select
                    options:
                      values:
                        - value: primary
                          label: Primary
                        - value: secondary
                          label: Secondary
  
  # ========================================================
  # DATA CATALOG
  # ========================================================

  - name: data_catalog
    label: Data Catalog
    type: file
    path: content/data_catalog.yml

    fields:
      - name: datasets
        label: Datasets
        type: object
        list: true

        fields:
          - name: title
            label: Dataset Title
            type: string
            required: true

          - name: product
            label: Data Product
            type: string
            required: true

          - name: description
            label: Dataset Description
            type: text

          - name: dates
            label: Date Coverage
            type: string

          - name: resolution
            label: Resolution
            type: string

          - name: region
            label: Region
            type: string

          - name: sensor_type
            label: Sensor Type
            type: string

          - name: time_series_type
            label: Time Series Type
            type: string

          - name: geostationary
            label: Geostationary
            type: select
            options:
              values: ["Yes", "No"]

          - name: blended
            label: Blended Product
            type: select
            options:
              values: ["Yes", "No"]

          - name: gap_filled
            label: Gap Filled
            type: select
            options:
              values: ["Yes", "No"]

          - name: derived_product
            label: Derived Product
            type: select
            options:
              values: ["Yes", "No"]

          - name: composite
            label: Composite
            type: string

          - name: access
            label: ERDDAP Access Links
            type: object
            list: true

            fields:
              - name: label
                label: Link Label
                type: string
                required: true

              - name: url
                label: ERDDAP URL
                type: string
                required: true
  
  # ========================================================
  # DATASET MONITOR
  # ========================================================

  - name: dataset_monitor
    label: Dataset Monitor
    type: file
    path: content/dataset_monitor.yml

    fields:
      - name: datasets
        label: Monitored Datasets
        type: object
        list: true

        fields:
          - name: datasetID
            label: ERDDAP Dataset ID
            type: string
            required: true

          - name: label
            label: Dataset Display Name
            type: string
            required: true

          - name: category
            label: Satellite Data Product
            type: string
            required: true
  
  # ========================================================
  # ERDDAP DATA SERVER
  # ========================================================

  - name: data_server
    label: ERDDAP Data Server
    type: file
    path: content/data_server.yml

    fields:
      - name: hero
        label: Introduction
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string
          - name: title
            label: Page Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: primary_button
            label: Primary Button
            type: object
            fields:
              - name: label
                type: string
              - name: url
                type: string
          - name: secondary_button
            label: Secondary Button
            type: object
            fields:
              - name: label
                type: string
              - name: url
                type: string

      - name: features
        label: ERDDAP Features
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: cards
            label: Feature Cards
            type: object
            list: true
            fields:
              - name: title
                type: string
              - name: description
                type: text

      - name: learning
        label: ERDDAP Basics
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: title
            type: string
          - name: description
            type: text
          - name: sections
            label: Expandable Sections
            type: object
            list: true
            fields:
              - name: title
                type: string
                required: true

              - name: kind
                label: Section Type
                type: select
                options:
                  values:
                    - value: links
                      label: Resource Links
                    - value: request
                      label: URL Request Explanation
                    - value: formats
                      label: File Formats
                    - value: video
                      label: Video

              - name: paragraphs
                label: Paragraphs
                type: string
                list: true

              - name: links
                label: Resource Links
                type: object
                list: true
                fields:
                  - name: label
                    type: string
                  - name: url
                    type: string

              - name: url_pattern
                label: Example URL Pattern
                type: string

              - name: terms
                label: URL Components
                type: object
                list: true
                fields:
                  - name: name
                    type: string
                  - name: description
                    type: text

              - name: format_groups
                label: File Format Groups
                type: object
                list: true
                fields:
                  - name: title
                    type: string
                  - name: extensions
                    label: Comma-Separated Extensions
                    type: text

              - name: heading
                label: Video Heading
                type: string

              - name: description
                label: Video Description
                type: text

              - name: youtube_url
                label: YouTube URL
                type: string


# ==========================================================
# COASTWATCH WEST COAST NODE — PAGES CMS CONFIGURATION
# ==========================================================

# ----------------------------------------------------------
# Media management
# ----------------------------------------------------------

media:
  input: images
  output: /images


# ----------------------------------------------------------
# Editable website content
# ----------------------------------------------------------

content:

  # ========================================================
  # NEWS & EVENTS
  # ========================================================

  - name: news
    label: News & Events
    type: file
    path: content/news.yml

    fields:
      - name: news
        label: News Announcements
        type: object
        list: true

        fields:
          - name: title
            label: Announcement Title
            type: string
            required: true

          - name: description
            label: Description
            type: text
            required: true

          - name: date
            label: Publication Date
            type: date
            required: true

          - name: expiration
            label: Expiration Date
            type: date


  # ========================================================
  # HOMEPAGE
  # ========================================================

  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.yml

    fields:

      # ----------------------------------------------------
      # Hero section
      # ----------------------------------------------------

      - name: hero
        label: Hero Section
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Hero Title
            type: string
            required: true

          - name: description
            label: Hero Description
            type: text

          - name: background_image
            label: Background Image
            type: image

          - name: buttons
            label: Hero Buttons
            type: object
            list: true

            fields:
              - name: label
                label: Button Label
                type: string
                required: true

              - name: url
                label: Button URL
                type: string
                required: true

              - name: style
                label: Button Style
                type: select
                options:
                  values:
                    - value: primary
                      label: Primary
                    - value: secondary
                      label: Secondary


      # ----------------------------------------------------
      # News & Events section settings
      # ----------------------------------------------------

      - name: news_section
        label: News Section Settings
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Section Title
            type: string

          - name: archive_label
            label: Archive Link Label
            type: string

          - name: archive_url
            label: Archive URL
            type: string

          - name: max_items
            label: Number of News Items
            type: number


      # ----------------------------------------------------
      # Resources section
      # ----------------------------------------------------

      - name: resources_section
        label: Resources Section
        type: object

        fields:
          - name: eyebrow
            label: Eyebrow Text
            type: string

          - name: title
            label: Section Title
            type: string

          - name: cards
            label: Resource Cards
            type: object
            list: true

            fields:
              - name: title
                label: Card Title
                type: string
                required: true

              - name: description
                label: Description
                type: text

              - name: buttons
                label: Card Buttons
                type: object
                list: true

                fields:
                  - name: label
                    label: Button Label
                    type: string
                    required: true

                  - name: url
                    label: Button URL
                    type: string
                    required: true

                  - name: style
                    label: Button Style
                    type: select
                    options:
                      values:
                        - value: primary
                          label: Primary
                        - value: secondary
                          label: Secondary
  
  # ========================================================
  # DATA CATALOG
  # ========================================================

  - name: data_catalog
    label: Data Catalog
    type: file
    path: content/data_catalog.yml

    fields:
      - name: datasets
        label: Datasets
        type: object
        list: true

        fields:
          - name: title
            label: Dataset Title
            type: string
            required: true

          - name: product
            label: Data Product
            type: string
            required: true

          - name: description
            label: Dataset Description
            type: text

          - name: dates
            label: Date Coverage
            type: string

          - name: resolution
            label: Resolution
            type: string

          - name: region
            label: Region
            type: string

          - name: sensor_type
            label: Sensor Type
            type: string

          - name: time_series_type
            label: Time Series Type
            type: string

          - name: geostationary
            label: Geostationary
            type: select
            options:
              values: ["Yes", "No"]

          - name: blended
            label: Blended Product
            type: select
            options:
              values: ["Yes", "No"]

          - name: gap_filled
            label: Gap Filled
            type: select
            options:
              values: ["Yes", "No"]

          - name: derived_product
            label: Derived Product
            type: select
            options:
              values: ["Yes", "No"]

          - name: composite
            label: Composite
            type: string

          - name: access
            label: ERDDAP Access Links
            type: object
            list: true

            fields:
              - name: label
                label: Link Label
                type: string
                required: true

              - name: url
                label: ERDDAP URL
                type: string
                required: true
  
  # ========================================================
  # DATASET MONITOR
  # ========================================================

  - name: dataset_monitor
    label: Dataset Monitor
    type: file
    path: content/dataset_monitor.yml

    fields:
      - name: datasets
        label: Monitored Datasets
        type: object
        list: true

        fields:
          - name: datasetID
            label: ERDDAP Dataset ID
            type: string
            required: true

          - name: label
            label: Dataset Display Name
            type: string
            required: true

          - name: category
            label: Satellite Data Product
            type: string
            required: true

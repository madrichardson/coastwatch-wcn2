project:
  type: website
  output-dir: _site

website:
  title: "CoastWatch West Coast Node"
  favicon: images/coastwatch.png
  page-navigation: true
  site-url: https://madrichardson.github.io/coastwatch-wcn2/

  navbar:
    logo: images/coastwatch_logo.png
    right:
      - text: " "
        href: index.qmd

      - text: "Data Access"
        menu:
          - text: Data Catalog
            href: data_catalog.qmd
          - text: Dataset Monitor
            href: dataset_monitor.qmd
          - text: Data Server
            href: data_server.qmd

      - text: "Tools and Training"
        menu:
          - text: Tools
            href: tools.qmd
          - text: Training
            href: training.qmd
          - text: Code Gallery
            href: code_gallery.qmd

      - text: "Applications"
        href: applications.qmd

      - text: "About"
        menu:
          - text: CoastWatch
            href: coastwatch.qmd
          - text: People
            href: people.qmd
          - text: Contact Us
            href: contact_us.qmd
          - text: Customer Survey
            href: customer_survey.qmd
          - text: News Archive
            href: news_archive.qmd

format:
  html:
    theme: flatly
    css: css/styles.css
    toc: false
    fontsize: 1.05em

    grid:
      body-width: 1100px

    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    include-after-body:
      - includes/footer.html

execute:
  echo: false
  warning: false
  error: false

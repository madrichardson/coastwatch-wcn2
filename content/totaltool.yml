# ==========================================================
# PROJECT CARDS
# ==========================================================

cards:

  - title: "Turtle Bycatch Overview"
    description: >-
      The Temperature Observations To Avoid Loggerheads (TOTAL)
      program brings together agencies, universities, and the
      fishing industry to reduce bycatch of endangered North
      Pacific loggerhead turtles, which migrate near California
      during warm seasons and risk unintended capture by
      commercial fisheries.
    buttons:
      - label: "Learn More"
        url: "totaltool-background.qmd"

  - title: "Conservation Area Status"
    description: >-
      The Pacific Loggerhead Conservation Area off Southern
      California closes to drift gillnet fishing when warm ocean
      conditions bring loggerheads into fishing grounds, with
      closure rules and real-time status available online.
    buttons:
      - label: "Closure Rules"
        url: "totaltool-closure-rules.qmd"
      - label: "Closure Status"
        url: "totaltool-closure-status.qmd"

  - title: "Historical Data Dashboard"
    description: >-
      Historical data since 2003 provide sea surface temperature,
      anomalies, El Niño status, and closure history for the
      Pacific Loggerhead Conservation Area off Southern California.
    buttons:
      - label: "View Data"
        url: "totaltool-data-dashboard.qmd"

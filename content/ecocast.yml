cards:
  - title: "What is EcoCast?"
    description: >-
      EcoCast is a real-time tool to help fishers and managers allocate
      effort to reduce bycatch while optimizing target harvest.
    button_label: "Learn More"
    button_url: "about_ecocast.qmd"

  - title: "Finding a good place to fish"
    description: >-
      EcoCast maps combine predicted distributions of target and bycatch
      species to suggest better and worse fishing zones.
    button_label: "View the Map"
    button_url: "ecocast_map.qmd"

  - title: "Scenario analysis"
    description: >-
      EcoCast Explorer tool gives users an opportunity to explore how
      species are responding to changing ocean conditions, and how
      that can influence the EcoCast Map product.
    button_label: "Run Analysis"
    button_url: "ecocast_explorer.qmd"


# ==========================================================
# LOGGERHEAD CONSERVATION AREA
# ==========================================================

conservation_area:
  eyebrow: "CONSERVATION AREA"
  title: "Loggerhead Conservation Area"

  paragraphs:
    - >-
      Higher than normal sea temperatures, like those observed during
      El Niño events, have been correlated with the presence of
      loggerheads in the waters off Southern California that overlap
      with California drift gillnet fishing grounds. The Pacific
      Loggerhead Conservation Area was created in 2003, and amended
      in 2007, to protect Pacific loggerhead turtles (Federal Register
      [72 FR 31756](https://www.federalregister.gov/documents/2007/06/08/E7-11124/fisheries-off-west-coast-states-highly-migratory-species-fisheries)).
      It is located south of Point Conception, CA, and east of 120° W.
      longitude.

  image:
    path: "images/conservation_area.png"
    alt: >-
      The Conservation Area encompasses U.S. waters of the Pacific
      Ocean off the Southern California coast that are within the
      black line to the coast.
    caption: "The Conservation Area encompasses U.S. waters of the Pacific Ocean off the Southern California coast that are within the black line to the coast."


# ==========================================================
# STANDING CLOSURE RULE
# ==========================================================

standing_rule:
  eyebrow: "REGULATORY CONDITIONS"
  title: "Standing Closure Rule"

  introduction:
    - >-
      Within the conservation area, fishing with DGN gear is subject
      to closure from June 1 to August 31 if the following
      environmental conditions are met:

  conditions:
    - title: "El Niño Event"
      description: >-
        An El Niño event is occurring or is forecast to occur

    - title: "Regional Ocean Conditions"
      description: >-
        El Niño conditions (warmer than normal waters) occur off
        Southern California.

  explanation:
    - >-
      Sea surface temperature data from the third and second months
      prior to the month of the closure will be used to determine
      whether El Niño conditions are present off Southern California.

  period_label: "POTENTIAL CLOSURE PERIOD"
  period: "June 1 – August 31"
  period_note: >-
    Sea surface temperatures from the second and third months
    preceding the closure month are used to evaluate conditions.

# ==========================================================
# PROPOSED TOTAL TOOL
# ==========================================================

total_tool:
  eyebrow: "PROPOSED BYCATCH AVOIDANCE TOOL"
  title: "Proposed New Bycatch Avoidance Tool"

  paragraphs:
    - >-
      The Temperature Observations To Avoid Loggerhead (TOTAL) tool
      was designed as an additional metric to guide the timing of
      the Loggerhead Conservation Area. The TOTAL tool consists of
      an indicator and a threshold (Welch et al. 2018). The indicator
      is a time-series of monthly temperature anomalies in the
      Southern California Bight smoothed by the preceding six months.
      The threshold is reference point, over which increased
      loggerhead bycatch has been demonstrated to occur.

    - >-
      Each month, new temperature anomaly data are processed to
      extend the length of the indicator by one month. When the
      indicator is above the threshold, our analysis shows
      loggerheads are more likely to be present within the
      Loggerhead Conservation Area. When the indicator is below
      the threshold, loggerheads are less likely to be present,
      and fishing can occur with reduced bycatch risk.

  threshold_label: "TOTAL INDICATOR THRESHOLD"
  threshold: "0.77"
  threshold_note: >-
    Values above the threshold indicate a greater likelihood
    of loggerhead presence within the conservation area.

  image:
    path: "images/bycatch_avoidance_tool.png"
    alt: >-
      The bycatch indicator, based on water temperature measured for
      the preceding six months.
    caption: >-
      The bycatch indicator, based on water temperature measured for
      the preceding six months. The plot demonstrates the indicator's
      ability to avoid turtle interactions (red dots represent turtle
      sightings) if fisheries were closed when indicator values exceed
      the 0.77 threshold.



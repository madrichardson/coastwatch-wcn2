
hero:
  eyebrow: "WHALEWATCH 2.0 PROJECT"
  title: "WhaleWatch 2.0"
  subtitle: "An Eco-Informatic Tool for Conserving Protected Species"
  description: >-
    Supporting conservation of endangered blue whales through
    dynamic habitat predictions and ocean management tools.
  image: "images/blue_whale2.png"
  image_alt: "Blue whale"
  image_caption: "Photo courtesy of Elliot Hazen, NOAA Fisheries"

cards:
  - title: "What is WhaleWatch 2.0?"
    description: >-
      Blue whales are an endangered species that inhabit the water off
      the U.S. West Coast, where they are threatened by ship strikes.
      The WhaleWatch 2.0 project has developed a dynamic model that
      helps scientists and managers reduce the risk of ship strikes
      to blue whales.
    button_label: "View Details"
    button_url: "about-whalewatch.html"

  - title: "Reducing Risk to Blue Whales"
    description: >-
      The WhaleWatch 2.0 Map product is a spatial management tool that
      predicts the most likely times and places that blue whales will
      be present along the U.S. West Coast, helping inform management
      decisions that reduce the risk of ship strikes and other threats.
    button_label: "View the Map"
    button_url: "whalewatch-products.html"

  - title: "Historical Data Explorer"
    description: >-
      The WhaleWatch 2.0 Explorer allows users to explore how the model
      predicts blue whales respond to changing ocean conditions between
      and within years, and how this influences the WhaleWatch 2.0 Map
      product. Users can generate predictive, interactive maps for
      specific dates in three different years.
    button_label: "Run Analyses"
    button_url: "whalewatch-explorer.html"


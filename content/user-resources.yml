navigation:
  links:
    - label: "VIIRS NetPP Products"
      url: "netpp.qmd"
    - label: "Algorithm & Data"
      url: "algorithm-data.qmd"
    - label: "Statistical Analysis"
      url: "statistical-analysis.qmd"
    - label: "User Resources"
      url: "user-resources.qmd"

header:
  eyebrow: "VIIRS PRIMARY PRODUCTIVITY"
  title: "User Resources"
  description: >-
    Access Python and R tutorials, satellite-derived primary
    productivity datasets, algorithm inputs, and statistical
    analysis products.

gallery:
  title: "Code Gallery"
  introduction: >-
    Explore tutorials designed to help users analyze and compare
    legacy and interim primary productivity products using Python or R.

  groups:
    - title: "Customizable Regional Analysis Tutorials"
      tutorials:

        - title: "Unbiased Relative Difference Analysis of the Legacy and Interim Products"
          image: "images/ccal_psi_netpp.png"
          image_alt: "Regional unbiased relative difference analysis"
          description: >-
            Calculate the mean unbiased relative difference (ψ)
            between the legacy and interim products for a
            user-specified region.
          links:
            - label: "Python Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn/tree/main/tutorials/Python/longhurst/unbiased_relative_difference/longhurst_unbiased_relative_difference.ipynb"
            - label: "R Tutorial"
              url: "https://github.com/coastwatch-wcn/primary_productivity/tree/main/tutorials/R/longhurst/unbiased_relative_difference/longhurst_unbiased_relative_difference.Rmd"

        - title: "Absolute Relative Difference Analysis of the Legacy and Interim Products"
          image: "images/carb_delta_netpp.png"
          image_alt: "Regional absolute relative difference analysis"
          description: >-
            Calculate the absolute relative difference (Δ)
            between the legacy and interim products for a
            user-specified region.
          links:
            - label: "Python Tutorial"
              url: "https://github.com/coastwatch-wcn/primary_productivity/tree/main/tutorials/Python/longhurst/absolute_relative_difference/longhurst_absolute_relative_difference.ipynb"
            - label: "R Tutorial"
              url: "https://github.com/coastwatch-wcn/primary_productivity/tree/main/tutorials/R/longhurst/absolute_relative_difference/longhurst_absolute_relative_difference.Rmd"

        - title: "Contingency Tables: Assessing the Similarity Between Two Primary Productivity Products"
          image: "images/CCAL_3x3_contingency.png"
          image_alt: "Regional contingency matrix analysis"
          description: >-
            Construct a contingency matrix to compare the trends
            between the legacy and interim products for a
            user-specified region.
          links:
            - label: "Python Tutorial"
              url: "https://github.com/coastwatch-wcn/primary_productivity/tree/main/tutorials/Python/longhurst/contingency_matrix/longhurst_contingency_matrices.ipynb"
            - label: "R Tutorial"
              url: "https://github.com/coastwatch-wcn/primary_productivity/tree/main/tutorials/R/longhurst/contigency_matrix/longhurst_contingency_matrices.Rmd"

    - title: "Full Statistical Analysis Tutorials"
      tutorials:

        - title: "Primary Productivity Unbiased Relative Difference Analysis"
          description: >-
            Calculate the mean unbiased relative difference (ψ)
            of the interim VIIRS netPP and legacy MODIS netPP
            products for each month from the time series shared
            between the two sensors.
          links:
            - label: "Python Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn.github.io/tree/main/projects/primary-productivity/tutorials/Python/raw_calculations/unbiased_relative_difference/raw_unbiased_relative_difference.ipynb"
            - label: "R Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn.github.io/tree/main/projects/primary-productivity/tutorials/R/raw_calculations/unbiased_relative_difference/raw_unbiased_relative_difference.Rmd"

        - title: "Primary Productivity Absolute Relative Difference Analysis"
          description: >-
            Calculate the mean absolute relative difference (Δ)
            of the interim VIIRS netPP product and legacy MODIS
            netPP product for each month from a time series
            shared between the two sensors.
          links:
            - label: "Python Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn.github.io/tree/main/projects/primary-productivity/tutorials/Python/raw_calculations/absolute_relative_difference/raw_absolute_relative_difference.ipynb"
            - label: "R Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn.github.io/tree/main/projects/primary-productivity/tutorials/R/raw_calculations/absolute_relative_difference/raw_absolute_relative_difference.Rmd"

        - title: "Calculating Trends and P-Values for Legacy and Interim NetPP Products"
          description: >-
            Generate trends for satellite-derived hourly means
            of legacy or interim primary productivity products.
          links:
            - label: "Python Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn.github.io/tree/main/projects/primary-productivity/tutorials/Python/raw_calculations/trends/raw_trends_primary_productivity.ipynb"
            - label: "R Tutorial"
              url: "https://github.com/coastwatch-wcn/coastwatch-wcn.github.io/tree/main/projects/primary-productivity/tutorials/R/raw_calculations/trends/raw_trends_primary_productivity.Rmd"


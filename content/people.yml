acknowledgements:
  title: "Acknowledgements"

  paragraphs:
    - >-
      This website was developed to support the activities of the NOAA CoastWatch
      West Coast Node (WCN) and to provide access to regional satellite data
      products, tools, and project resources for the satellite data community.

    - >-
      The website architecture, design, and implementation were developed by
      <strong>Madison Richardson</strong> using the Quarto publishing system with
      integrated GitHub version control and automated rendering workflows.

    - >-
      <strong>Sunny Hospital</strong> provided assistance during the intial
      setup of the website and contributed materials and project content that
      are featured throughout the site.

    - >-
      <strong>Jen Sevadjian</strong> contributed materials and project content
      that support the resources and applications presented on this site.

    - >-
      The projects, datasets, and tools featured throughout the website represent
      the collaborative work of CoastWatch scientists, developers, and partners
      across NOAA Fisheries and the broader satellite data community.

hero:
  eyebrow: "OUR TEAM"
  title: "People"
  description: >-
    The CoastWatch West Coast Node supports the development and distribution
    of satellite-derived oceanographic data products, tools, and applications
    for the satellite data community. The website and resources hosted here
    are maintained by the people below.

team:
  eyebrow: "COASTWATCH WEST COAST NODE"
  title: "Meet Our Team"

  members:
    - name: "Cara Wilson"
      role: "Manager, CoastWatch West Coast"

    - name: "Dale Robinson"
      role: "Development Lead, CoastWatch West Coast"

    - name: "Madison Richardson"
      role: "Environmental Data Analyst, CoastWatch West Coast"

    - name: "Jonathan Sherman"

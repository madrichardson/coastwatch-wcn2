  title: "About EcoCast"
  subtitle: "Supporting sustainable fisheries through dynamic ocean management."

mission:
  title: "Mission and Vision"
  paragraphs:
    - >-
      EcoCast is a fisheries sustainability tool that helps fishers and
      managers evaluate how to allocate fishing effort to maintain target
      fish catch while minimizing bycatch of protected or threatened species.
    - >-
      The mission of our project is to bring best-available science and
      analyses to support the ecological sustainability and economic viability
      for U.S. fisheries. With decades of experience in fisheries bycatch,
      fisheries mapping, oceanographic and species distribution analyses,
      our research team is working to support the development of innovative
      management approaches that meet ecological and economic management
      objectives and mandates.


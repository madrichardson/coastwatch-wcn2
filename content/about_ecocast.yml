management:
  title: "Dynamic Ocean Management"
  introduction: >-
    Dynamic ocean management is a new management approach that uses real-time
    and near real-time data to support management responses that can change
    in space and time, at scales relevant for animal movement and human use.
    Dynamic ocean management can use diverse analytical approaches
    (simple to complex), supports climate-resilient fisheries, and is already
    implemented in many oceans around the world.

  comparison_title: "How does it differ from traditional ocean management?"

  traditional:
    title: "Traditional Ocean Management"
    points:
      - "Boundaries are fixed in space and time."
      - "Static schemes must be large enough to capture broad-scale ocean processes."
      - "Can have high opportunity costs for fishers."
      - "Rendered ineffective during anomalous events (e.g. species seasonal migrations or shifts of fishing fleets)."

  dynamic:
    title: "Dynamic Ocean Management"
    points:
      - "Boundaries and recommendations can change in near real time."
      - "Align management actions with the variability of ecosystems."
      - "Incorporates diverse data sources:"
      - "Provides managers with recommendations that reflect current marine conditions."
    data_sources:
      - "Satellite data"
      - "Ocean monitoring arrays"
      - "Bio-geochemical models"
      - "Crowd-sourced reports from ocean users"

why_it_matters:
  title: "Why it matters"
  description: >-
    Dynamic ocean management sits at the interface of science and management.
    It captures the best-available science and directs it to meet the needs
    of resource managers and the fishing industry.
  highlight_title: "What’s exciting about this research:"
  points:
    - "Puts science and data analytics to work in real time, and"
    - "Fundamentally changes how oceans are managed."


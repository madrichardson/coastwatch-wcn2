  description: The MODIS (Moderate Resolution Imaging Spectro-radiometer) sensor was deployed onboard the NASA Aqua
    satellite. It is a multi-disciplinary sensor providing data for the ocean, land, aerosol, and cloud research
    and is used for detecting chlorophyll-a concentrations in the world's oceans, among other applications. Aqua
    MODIS views the entire Earth's surface every 2 days, acquiring data in 36 spectral bands. This dataset was reprocessed
    by NASA in 2018.

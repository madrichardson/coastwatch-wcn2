  composite: '"Daily NRT, Science Quality"'
  description: This datasets blends chlorophyll data from the NOAA-SNPP and NOAA-20 VIIRS ocean color sensors. A
    gap-filling application was employed to fill in data gaps that uses a mathematical technique based on the data
    interpolating empirical orthogonal function (DINEOF). This technique exploits the coherency over location and
    time of the data from the two satellites to infer a value at the missing location. CoastWatch serves this daily
    global gap-filled product at ~9 km spatial resolution in a NetCDF file format.
  access:

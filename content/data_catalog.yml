  description: The NASA SeaWiFS (Sea-viewing Wide Field-of-view Sensor) sensor onboard the SeaStart spacecraft was
    used for detecting and measuring global sea-surface chlorophyll-a concentrations throughout the world's oceans
    from 1997 through 2010. During that time, the satellite was able to establish an unprecedented time series of
    global chlorophyll-a concentrations. The sensor started experiencing issues around 2008 leading to significant
    missing data in 2008-2010, so it is recommended to be cautious with data post 2007. This dataset was reprocessed
    by NASA in 2018.

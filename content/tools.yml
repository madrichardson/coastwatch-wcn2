# ==========================================================
# SOFTWARE TOOLS & RESOURCES
# ==========================================================

hero:
  eyebrow: "SOFTWARE & RESOURCES"
  title: "Software Tools & Resources"
  description: >-
    Discover software, packages, and utilities for accessing,
    processing, analyzing, and visualizing satellite-derived
    oceanographic data.

section:
  eyebrow: "EXPLORE TOOLS"
  title: "Tools for Working with Ocean Data"
  description: >-
    Browse software and programming packages for accessing
    CoastWatch and ERDDAP datasets.

resources:

  - title: "CoastWatch Utilities Software"
    category: "Software"
    language: "Standalone Software"
    description: >-
      The CoastWatch Utilities, created by the NOAA/NESDIS
      CoastWatch program, allow users to work with Earth
      science data created by the NOAA/NESDIS CoastWatch
      program. Users can easily manipulate and visualize
      data in CoastWatch HDF format, NOAA 1b format, and
      some flavors of NetCDF 4. The Utilities are available
      free via a software package that contains the
      CoastWatch Utilities Library and the CoastWatch
      Data Analysis Tool.
    url: "https://coastwatch.noaa.gov/cwn/data-access-tools/coastwatch-utilities.html"
    button_label: "Explore Software"

  - title: "rerddap"
    category: "R Packages"
    language: "R"
    description: >-
      rerddap is an R package that leverages ERDDAP's
      RESTful web services to access metadata and data.
      It provides functions to query data from both
      gridded and tabular datasets, offering a convenient
      way to work with ERDDAP-hosted data.
    url: "https://packages.ropensci.org/rerddap/doc/rerddap.html"
    button_label: "View Documentation"

  - title: "rerddapXtracto"
    category: "R Packages"
    language: "R / MATLAB"
    description: >-
      Rerddap-Xtractomatic (Rerddapxtracto) is a set of
      free tools, written in R, that allows client-side
      access of environmental data served on the
      ERD/CoastWatch ERDDAP Server. The Rerddapxtracto
      tools were originally developed for the marine
      biology tagging community to extract satellite
      data coincident to the tracks from tagged animals.
      The packages have been extended to extract a 3D
      cube of data and time series from the region defined
      by the polygon. Rerddapxtracto scripts work within
      R to subset and extract satellite and other
      oceanographic-related data from a remote server.
      A legacy Xtractomatic package for Matlab is
      available but not supported.
    url: "https://rmendels.github.io/rerddapXtracto_docs/articles/UsingrerddapXtracto.html"
    button_label: "View Documentation"

  - title: "erddapy"
    category: "Python Packages"
    language: "Python"
    description: >-
      erddapy is a Python package that utilizes ERDDAP's
      RESTful web services to generate ERDDAP URLs.
      It allows users to perform various tasks, such as
      searching for datasets, retrieving metadata, and
      downloading data in a flexible and customizable
      manner.
    url: "https://ioos.github.io/erddapy/"
    button_label: "View Documentation"
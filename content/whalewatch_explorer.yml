
hero:
  eyebrow: "WHALEWATCH 2.0 PROJECT"
  title: "WhaleWatch 2.0 Explorer"
  subtitle: "Explore historical blue whale habitat predictions and changing ocean conditions in the California Current Ecosystem."

instructions:
  title: "Information & Instructions"
  introduction: >-
    WhaleWatch 2.0 Explorer gives users an opportunity to explore historical trends in the WhaleWatch 2.0 Map product.
  steps:
    - "Select historical date of interest."
    - "Download georeferenced data (raster GRID)."
    - "Customize the display: use dropdowns to change map extent, or to visualize the shipping lanes used to calculate the WhaleWatch Shipping Lanes Indicator."

explorer:
  title: "Interactive WhaleWatch 2.0 Explorer"
  description: "Use the interactive application below to explore historical WhaleWatch 2.0 predictions."
  app_url: "https://heatherwelch.shinyapps.io/benioff_app/"
  fallback_text: "If the embedded app does not load,"
  link_label: "open WhaleWatch 2.0 Explorer"


# ----------------------------------------------------------
# Resources section
# ----------------------------------------------------------

resources_section:
  eyebrow: "DATA & RESOURCES"
  title: "Explore CoastWatch Resources"

  cards:
    - title: "ERDDAP Data Server"
      description: >-
        Access, subset, visualize, and download satellite
        and environmental datasets in a variety of formats.
      buttons:
        - label: "Access ERDDAP"
          url: "https://coastwatch.pfeg.noaa.gov/erddap/index.html"
          style: "primary"
        - label: "Learn More"
          url: "data_server.qmd"
          style: "secondary"

    - title: "Dataset Monitoring"
      description: >-
        Explore the availability and update status of
        datasets hosted on the CoastWatch ERDDAP server.
      buttons:
        - label: "View Dataset Monitor"
          url: "dataset_monitor.qmd"
          style: "primary"

    - title: "Software & Tools"
      description: >-
        Discover software, R and Python packages, and
        resources for accessing and analyzing
        oceanographic data.
      buttons:
        - label: "Explore Software"
          url: "tools.qmd"
          style: "primary"

    - title: "Training & Tutorials"
      description: >-
        Learn how to work with satellite oceanographic
        datasets through tutorials, examples, and
        training resources.
      buttons:
        - label: "Training Resources"
          url: "training.qmd"
          style: "primary"
        - label: "Code Gallery"
          url: "code_gallery.qmd"
          style: "secondary"


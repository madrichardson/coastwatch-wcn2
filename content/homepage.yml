# ----------------------------------------------------------
# Resources section
# ----------------------------------------------------------

resources_section:
  eyebrow: "DATA & RESOURCES"
  title: "Explore CoastWatch Resources"

  cards:
    - title: "ERDDAP Data Server"
      description: >-
        The ERDDAP data server provides a simple, consistent way 
        to subset and download environmental datasets in common 
        file formats with options to make graphs and maps.

      buttons:
        - label: "Access ERDDAP"
          url: "https://coastwatch.pfeg.noaa.gov/erddap/index.html"
          style: "primary"
        - label: "Learn More"
          url: "data_server.qmd"
          style: "secondary"

    - title: "Dataset Monitoring"
      description: >-
        Explore the availability and update status of
        datasets hosted on the CoastWatch ERDDAP server.
      buttons:
        - label: "View Dataset Monitor"
          url: "dataset_monitor.qmd"
          style: "primary"

    - title: "Software & Tools"
      description: >-
        Explore tools for accessing and analyzing 
        satellite and oceanographic data via ERDDAP, 
        including R and Python packages and the CoastWatch 
        Utilities software for different data formats.

      buttons:
        - label: "Explore Software"
          url: "tools.qmd"
          style: "primary"

    - title: "Training & Tutorials"
      description: >-
        Learn how to work with satellite oceanographic
        datasets through tutorials, examples, and
        training resources.
      buttons:
        - label: "Training Resources"
          url: "training.qmd"
          style: "primary"
        - label: "Code Gallery"
          url: "code_gallery.qmd"
          style: "secondary"


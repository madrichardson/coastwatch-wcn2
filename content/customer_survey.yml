
hero:
  eyebrow: "WE VALUE YOUR FEEDBACK"
  title: "Customer Survey"
  description: >-
    Help us improve CoastWatch products, data services,
    and online resources by sharing your experience.

survey:
  eyebrow: "SHARE YOUR EXPERIENCE"
  title: "Help Us Improve Our Website"
  welcome: "Welcome!"
  description: >-
    This survey is designed to measure your level of
    satisfaction with NOAA's websites. It consists of
    12 questions and should take approximately five
    minutes to complete. Please do not use this survey
    to provide comments on or responses to rules,
    notices, solicitations, or other official agency
    actions. Any information you provide will be used
    for the sole purpose of improving NOAA's products
    and services, in particular the website you are
    using now.

  button_label: "Take the Survey"
  button_url: "https://touchpoints.app.cloud.gov/touchpoints/f5a012ee/submit"

  note: >-
    If you want a response to a specific question,
    please use the contact and feedback section of
    this website.
  contact_label: "Contact & Feedback"
  contact_url: "contact_us.qmd"

fine_print:
  eyebrow: "ADDITIONAL INFORMATION"
  title: "Survey Information & Fine Print"
  introduction: >-
    Please review the following information about
    the purpose of this survey, voluntary participation,
    and the use of survey responses.

  sections:
    - title: "Purpose of the Survey"
      text: >-
        In accordance with Executive Order 12862,
        the National Performance Review, and good
        management practices, NOAA offices want to
        determine whether their customers are satisfied
        with the services and products they are receiving,
        and whether they have suggestions as to how the
        services and products may be improved or made
        more useful. The information will be used to
        improve NOAA's products and services.

    - title: "Official Correspondence"
      text: >-
        Responses to this survey will not be treated as
        official correspondence to the agency, so you
        may not receive a reply from NOAA. Do not use
        this survey to provide public comments on
        rulemakings, respond to solicitations, or
        communicate about any official agency action.
        Instead, provide your comments or feedback as
        described in the action you want to respond to,
        or use a designated channel for official comments
        (for example, www.regulations.gov to comment
        on notices of rulemaking).

    - title: "Voluntary Participation"
      text: >-
        Responding to this survey is completely voluntary.
        No confidentiality can be provided for responses,
        and you need not supply your name or address.
        Any information you provide will be used for the
        sole purpose of improving NOAA's products and
        services.

    - title: "Public Reporting Burden"
      text: >-
        Public reporting burden for this collection of
        information is estimated to average 5 minutes.
        Send comments regarding this burden estimate
        or any other aspect of this collection of
        information, including suggestions for reducing
        this burden, to:

  contact_information: |-
    Adrienne Thomas, OCIO/CDO 151
    Patton Avenue
    Asheville, NC 28801
    828-257-3148

  paperwork_notice: >-
    Notwithstanding any other provision of the law,
    no person is required to respond to, nor shall any
    person be subject to a penalty to comply with,
    a collection of information subject to the
    requirements of the Paperwork Reduction Act,
    unless that collection of information displays
    a currently valid OMB Control Number.

  omb_label: "Paperwork Reduction Act Information"
  omb_number: "0690-0030"
  omb_expiration: "07/31/2026"



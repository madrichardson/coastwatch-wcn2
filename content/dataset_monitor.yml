
import pandas as pd
import yaml
from pathlib import Path

csv_path = Path("spreadsheets/erddap-dataset-monitoring.csv")
output_path = Path("content/dataset_monitor.yml")

df = pd.read_csv(csv_path)
df.columns = df.columns.str.strip()

df = df.rename(columns={"dataset_ID": "datasetID"})

for col in ["datasetID", "label", "category"]:
    df[col] = df[col].fillna("").astype(str).str.strip()

df = df[df["datasetID"] != ""]
df = df.drop_duplicates(subset="datasetID", keep="first")

datasets = df[
    ["datasetID", "label", "category"]
].to_dict(orient="records")

output_path.parent.mkdir(parents=True, exist_ok=True)

with open(output_path, "w", encoding="utf-8") as f:
    yaml.safe_dump(
        {"datasets": datasets},
        f,
        sort_keys=False,
        allow_unicode=True,
        width=100
    )

print(f"Saved {len(datasets)} datasets to {output_path}")
